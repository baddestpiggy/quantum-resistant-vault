[package]
name = "quantum-resistant-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "File vault using post-quantum key exchange (ML-KEM) and AES-GCM"

[[bin]]
name = "pqvault"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hkdf = "0.13.0"
ml-kem = { version = "0.3.3", features = ["getrandom", "zeroize"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"
